<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<meta name="color-scheme" content="dark light">
<title>Clean Exit Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='1' y='1' width='38' height='38' rx='11' fill='%230b0d11'/%3E%3Cpath d='M9 30V14.5a11 11 0 0122 0V30' fill='none' stroke='%233ee6a8' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M13 30V15a7 7 0 0114 0v15' fill='none' stroke='%239d8cff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='22' r='2.6' fill='%233ee6a8'/%3E%3C/svg%3E">
<script>
  // apply theme/density before first paint (no flash)
  (function () {
    try {
      var p = localStorage.getItem('cp_theme') || 'auto';
      var th = p === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
      var d = document.documentElement;
      d.dataset.theme = th; d.dataset.density = localStorage.getItem('cp_density') || 'compact';
      var l = localStorage.getItem('cp_lang'); if (l === 'en') { d.lang = 'en'; d.dir = 'ltr'; }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="static/style.css">
</head>
<body class="cp-app font-vazirmatn">

<!-- ============ auth ============ -->
<div id="authView" class="auth" hidden>
  <div class="auth-art">
    <div id="authArt" class="art"></div>
    <div class="auth-claim">
      <span class="brand-mk lg" data-brand></span>
      <h1 data-i18n="panel_name">پنل خروجی تمیز</h1>
      <p data-i18n="auth_tagline"></p>
    </div>
  </div>
  <div class="auth-side">
    <div class="auth-tools">
      <button type="button" class="btn btn-ghost btn-icon btn-sm" data-act="theme" data-theme-ic></button>
      <button type="button" class="btn btn-ghost btn-sm lang-btn" data-act="lang"><span data-ic="lang"></span><span data-lang-lbl>EN</span></button>
    </div>
    <div class="auth-card">
      <div class="auth-head"><span class="brand-mk" data-brand></span><div><b>Clean Exit</b><small data-i18n="auth_welcome"></small></div></div>
      <form id="setupForm" class="form" hidden autocomplete="on">
        <p class="muted" data-i18n="setup_hint"></p>
        <div class="field"><label for="setupPw" data-i18n="password"></label><input type="password" id="setupPw" autocomplete="new-password" required></div>
        <div class="field"><label for="setupPw2" data-i18n="password2"></label><input type="password" id="setupPw2" autocomplete="new-password" required></div>
        <button class="btn btn-pri btn-block" type="submit"><span data-ic="key"></span><span class="btn-l" data-i18n="set_password"></span></button>
      </form>
      <form id="loginForm" class="form" hidden autocomplete="on">
        <div class="field"><label for="loginPw" data-i18n="password"></label><input type="password" id="loginPw" autocomplete="current-password" required></div>
        <button class="btn btn-pri btn-block" type="submit"><span data-ic="lock"></span><span class="btn-l" data-i18n="login"></span></button>
      </form>
      <p class="auth-foot"><span data-ic="shield"></span><span data-i18n="auth_foot"></span></p>
    </div>
  </div>
</div>

<!-- ============ app ============ -->
<div id="appView" hidden>
  <div id="app" class="app">
    <aside class="rail" id="rail">
      <div class="rail-brand"><span class="brand-mk" data-brand></span><span class="rail-name"><b>Clean Exit</b><small data-i18n="panel_name"></small></span></div>
      <nav class="rail-nav" id="railNav" aria-label="Main"></nav>
      <div class="rail-foot">
        <button type="button" class="rail-cmd" data-act="palette"><span data-ic="search"></span><span class="rail-cmd-l" data-i18n="pal_title"></span><kbd>Ctrl K</kbd></button>
        <div class="rail-meta"><span id="railVer" dir="ltr">v—</span><button type="button" class="btn btn-ghost btn-icon btn-sm" data-act="shortcuts" data-i18n-title="shortcuts"><span data-ic="code"></span></button><button type="button" class="btn btn-ghost btn-icon btn-sm rail-collapse" data-act="rail" data-i18n-title="collapse"><span data-ic="sidebar"></span></button></div>
      </div>
    </aside>
    <div class="scrim" data-act="rail"></div>
    <div class="stage">
      <header class="topbar">
        <button type="button" class="btn btn-ghost btn-icon btn-sm tb-menu" data-act="rail" data-i18n-title="menu"><span data-ic="menu"></span></button>
        <div class="tb-title"><h1 id="pageTitle"></h1><span id="pageSub"></span></div>
        <button type="button" class="tb-search" data-act="palette"><span data-ic="search"></span><span data-i18n="pal_ph"></span><kbd dir="ltr">Ctrl K</kbd></button>
        <div class="tb-tools">
          <button type="button" class="btn btn-ghost btn-icon btn-sm tb-search-m" data-act="palette" data-i18n-title="pal_title"><span data-ic="search"></span></button>
          <button type="button" class="btn btn-ghost btn-icon btn-sm" data-act="density" data-density-ic></button>
          <button type="button" class="btn btn-ghost btn-icon btn-sm" data-act="theme" data-theme-ic></button>
          <button type="button" class="btn btn-ghost btn-sm lang-btn" data-act="lang"><span data-ic="lang"></span><span data-lang-lbl>EN</span></button>
          <button type="button" class="btn btn-ghost btn-icon btn-sm" id="logoutBtn" data-act="logout" data-i18n-title="logout"><span data-ic="logout"></span></button>
        </div>
      </header>
      <main class="views">
        <section id="view-overview" class="view" hidden></section>
        <section id="view-inbounds" class="view" hidden></section>
        <section id="view-exits" class="view" hidden></section>
        <section id="view-users" class="view" hidden></section>
        <section id="view-logs" class="view" hidden></section>
        <section id="view-settings" class="view" hidden></section>
      </main>
    </div>
    <nav class="dock" id="dockNav" aria-label="Main"></nav>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<script src="static/qrcode.js"></script>
<script src="static/app.js"></script>
</body>
</html>
